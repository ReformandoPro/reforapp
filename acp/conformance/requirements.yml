# ACP Conformance Suite 0.1 - requirement catalogue
#
# Stable, citable conformance requirements. Every requirement declares:
#   normative_sources   structured, resolvable references (document + sha + section)
#   supporting_sources  informative material, never a sole normative basis
#   source_status       normative | implementation-normative | binding-normative
#                       | suite-native | informative-only
#   traceability_refs   TRACE-nnn rows of acp/schema/TRACEABILITY.md it covers
#   traceability_status source-derived | suite-native
#
# This file defines WHAT must hold and WHO can test it. No test cases, no
# fixtures, nothing executable.
