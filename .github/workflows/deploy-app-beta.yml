name: Deploy app-beta

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app-beta
  cancel-in-progress: false

jobs:
  deploy-app-beta:
    name: Deploy reformando-app-beta
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.APP_BETA_SSH_PRIVATE_KEY }}" > ~/.ssh/app_beta_deploy_key
          chmod 600 ~/.ssh/app_beta_deploy_key

          printf '%s\n' "${{ secrets.APP_BETA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy main to reformando-app-beta
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/app_beta_deploy_key \
            -p "${{ secrets.APP_BETA_SSH_PORT }}" \
            "${{ secrets.APP_BETA_SSH_USER }}@${{ secrets.APP_BETA_SSH_HOST }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          REPO="/docker/openclaw-ejvk/data/apps/reformando-app"
          COMPOSE="/docker/reformando-app-beta"
          SERVICE="reformando-app-beta"

          if [ "$REPO" != "/docker/openclaw-ejvk/data/apps/reformando-app" ]; then
            echo "Refusing to deploy: unexpected repo path: $REPO" >&2
            exit 1
          fi

          if [ "$COMPOSE" != "/docker/reformando-app-beta" ]; then
            echo "Refusing to deploy: unexpected compose path: $COMPOSE" >&2
            exit 1
          fi

          if [ "$SERVICE" != "reformando-app-beta" ]; then
            echo "Refusing to deploy: unexpected service: $SERVICE" >&2
            exit 1
          fi

          test -d "$REPO"
          test -d "$COMPOSE"

          cd "$REPO"

          git status --short
          git config --unset-all core.sshCommand || true
          git remote set-url origin https://github.com/ReformandoPro/reforapp.git
          git remote -v
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          EXPECTED_SHA="${{ github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refusing to deploy unexpected SHA: $ACTUAL_SHA" >&2
            exit 1
          fi

          echo "Deploying commit:"
          git rev-parse HEAD
          git --no-pager log --oneline -5

          cd "$COMPOSE"

          docker compose config --services | grep -qx "$SERVICE"

          docker compose build --build-arg GIT_COMMIT_SHA="$EXPECTED_SHA" "$SERVICE"
          docker compose up -d --no-deps "$SERVICE"

          docker compose ps "$SERVICE"
          docker compose logs --tail=120 "$SERVICE"

          HEALTH_URL="https://app-beta.reformando.pro/api/health"
          HEALTH_STARTED_AT="$(date +%s)"
          HEALTH_DEADLINE="$((HEALTH_STARTED_AT + 60))"
          ATTEMPT=0
          while :; do
            NOW="$(date +%s)"
            REMAINING="$((HEALTH_DEADLINE - NOW))"
            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            ATTEMPT="$((ATTEMPT + 1))"
            REQUEST_TIMEOUT="$REMAINING"
            if [ "$REQUEST_TIMEOUT" -gt 5 ]; then
              REQUEST_TIMEOUT=5
            fi

            RESPONSE="$(curl --fail --silent --show-error --max-time "$REQUEST_TIMEOUT" "$HEALTH_URL" 2>/dev/null || true)"
            if EXPECTED_SHA="$EXPECTED_SHA" RESPONSE="$RESPONSE" node - <<'NODE'
          const expected = process.env.EXPECTED_SHA;
          try {
            const body = JSON.parse(process.env.RESPONSE || "");
            process.exit(body.status === "ok" && body.commit === expected ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
            then
              echo "Health check passed for $EXPECTED_SHA"
              exit 0
            fi

            NOW="$(date +%s)"
            REMAINING="$((HEALTH_DEADLINE - NOW))"
            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            SLEEP_SECONDS=2
            if [ "$SLEEP_SECONDS" -gt "$REMAINING" ]; then
              SLEEP_SECONDS="$REMAINING"
            fi
            echo "Health check pending (attempt $ATTEMPT; ${REMAINING}s remaining)" >&2
            sleep "$SLEEP_SECONDS"
          done

          echo "Health check failed for expected SHA $EXPECTED_SHA after 60 seconds" >&2
          exit 1
          REMOTE
