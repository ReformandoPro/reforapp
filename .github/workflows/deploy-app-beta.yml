name: Deploy app-beta

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation mode'
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - diagnose_service_role
      deploy_sha:
        description: 'Full 40-character commit SHA to deploy'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-app-beta
  cancel-in-progress: false

jobs:
  deploy-app-beta:
    name: Deploy reformando-app-beta
    if: ${{ github.event_name == 'push' || inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          APP_BETA_SSH_HOST: ${{ secrets.APP_BETA_SSH_HOST }}
          APP_BETA_SSH_USER: ${{ secrets.APP_BETA_SSH_USER }}
          APP_BETA_SSH_PORT: ${{ secrets.APP_BETA_SSH_PORT }}
          APP_BETA_SSH_PRIVATE_KEY: ${{ secrets.APP_BETA_SSH_PRIVATE_KEY }}
          APP_BETA_SSH_KNOWN_HOSTS: ${{ secrets.APP_BETA_SSH_KNOWN_HOSTS }}
          APP_BETA_HEALTH_USERNAME: ${{ secrets.APP_BETA_HEALTH_USERNAME }}
          APP_BETA_HEALTH_PASSWORD: ${{ secrets.APP_BETA_HEALTH_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for variable in \
            APP_BETA_SSH_HOST \
            APP_BETA_SSH_USER \
            APP_BETA_SSH_PORT \
            APP_BETA_SSH_PRIVATE_KEY \
            APP_BETA_SSH_KNOWN_HOSTS \
            APP_BETA_HEALTH_USERNAME \
            APP_BETA_HEALTH_PASSWORD
          do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $variable"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.APP_BETA_SSH_PRIVATE_KEY }}" > ~/.ssh/app_beta_deploy_key
          chmod 600 ~/.ssh/app_beta_deploy_key

          printf '%s\n' "${{ secrets.APP_BETA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy main to reformando-app-beta
        shell: bash
        env:
          DEPLOY_SHA_INPUT: ${{ inputs.deploy_sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED_SHA="$DEPLOY_SHA_INPUT"
          else
            EXPECTED_SHA="${{ github.sha }}"
          fi

          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Refusing to deploy: expected SHA must be exactly 40 hexadecimal characters" >&2
            exit 1
          fi

          ssh \
            -i ~/.ssh/app_beta_deploy_key \
            -p "${{ secrets.APP_BETA_SSH_PORT }}" \
            "${{ secrets.APP_BETA_SSH_USER }}@${{ secrets.APP_BETA_SSH_HOST }}" \
            "EXPECTED_SHA=$EXPECTED_SHA bash -s" <<'REMOTE'
          set -euo pipefail

          REPO="/docker/openclaw-ejvk/data/apps/reformando-app"
          COMPOSE="/docker/reformando-app-beta"
          SERVICE="reformando-app-beta"

          if [ "$REPO" != "/docker/openclaw-ejvk/data/apps/reformando-app" ]; then
            echo "Refusing to deploy: unexpected repo path: $REPO" >&2
            exit 1
          fi

          if [ "$COMPOSE" != "/docker/reformando-app-beta" ]; then
            echo "Refusing to deploy: unexpected compose path: $COMPOSE" >&2
            exit 1
          fi

          if [ "$SERVICE" != "reformando-app-beta" ]; then
            echo "Refusing to deploy: unexpected service: $SERVICE" >&2
            exit 1
          fi

          test -d "$COMPOSE"

          REMOTE_URL="https://github.com/ReformandoPro/reforapp.git"
          DEPLOY_ROOT="$(mktemp -d /tmp/reformando-app-beta-deploy.XXXXXX)"
          trap 'rm -rf "$DEPLOY_ROOT"' EXIT
          git clone --no-checkout --no-tags "$REMOTE_URL" "$DEPLOY_ROOT/repo"
          cd "$DEPLOY_ROOT/repo"
          git fetch --no-tags origin "$EXPECTED_SHA"
          if ! git cat-file -e "$EXPECTED_SHA^{commit}"; then
            echo "Refusing to deploy: requested commit does not exist in the repository" >&2
            exit 1
          fi
          git checkout --detach "$EXPECTED_SHA"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refusing to deploy unexpected SHA after detached checkout" >&2
            exit 1
          fi

          echo "Deploying commit:"
          git rev-parse HEAD
          git --no-pager log --oneline -5

          COMPOSE_OVERRIDE="$DEPLOY_ROOT/compose.override.yml"
          cat > "$COMPOSE_OVERRIDE" <<'COMPOSE'
          services:
            reformando-app-beta:
              build:
                context: ${DEPLOY_ROOT}/repo
                dockerfile: Dockerfile
                args:
                  GIT_COMMIT_SHA: ${EXPECTED_SHA}
          COMPOSE

          cd "$COMPOSE"

          docker compose -f docker-compose.yml -f "$COMPOSE_OVERRIDE" config --services | grep -qx "$SERVICE"
          DEPLOY_ROOT="$DEPLOY_ROOT" EXPECTED_SHA="$EXPECTED_SHA" docker compose -f docker-compose.yml -f "$COMPOSE_OVERRIDE" build "$SERVICE"
          docker compose -f docker-compose.yml -f "$COMPOSE_OVERRIDE" up -d --no-deps "$SERVICE"
          docker compose -f docker-compose.yml -f "$COMPOSE_OVERRIDE" ps "$SERVICE"
          docker compose -f docker-compose.yml -f "$COMPOSE_OVERRIDE" logs --tail=120 "$SERVICE"
          REMOTE

      - name: Verify app-beta health
        shell: bash
        env:
          DEPLOY_SHA_INPUT: ${{ inputs.deploy_sha }}
          HEALTH_USERNAME: ${{ secrets.APP_BETA_HEALTH_USERNAME }}
          HEALTH_PASSWORD: ${{ secrets.APP_BETA_HEALTH_PASSWORD }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED_SHA="$DEPLOY_SHA_INPUT"
          else
            EXPECTED_SHA="${{ github.sha }}"
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Health check refused: expected SHA format is invalid" >&2
            exit 1
          fi

          HEALTH_URL="https://app-beta.reformando.pro/api/health"
          HEALTH_STARTED_AT="$(date +%s)"
          HEALTH_DEADLINE="$((HEALTH_STARTED_AT + 60))"
          ATTEMPT=0
          LAST_HTTP_STATUS="not_requested"
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          while :; do
            NOW="$(date +%s)"
            REMAINING="$((HEALTH_DEADLINE - NOW))"
            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            ATTEMPT="$((ATTEMPT + 1))"
            REQUEST_TIMEOUT="$REMAINING"
            if [ "$REQUEST_TIMEOUT" -gt 5 ]; then
              REQUEST_TIMEOUT=5
            fi

            set +e
            LAST_HTTP_STATUS="$(curl \
              --silent \
              --show-error \
              --max-time "$REQUEST_TIMEOUT" \
              --user "${HEALTH_USERNAME}:${HEALTH_PASSWORD}" \
              --output "$RESPONSE_FILE" \
              --write-out '%{http_code}' \
              "$HEALTH_URL")"
            CURL_STATUS=$?
            set -e

            if [ "$CURL_STATUS" -ne 0 ]; then
              LAST_HTTP_STATUS="curl_exit_${CURL_STATUS}"
            fi

            RESPONSE="$(cat "$RESPONSE_FILE")"
            if [ "$LAST_HTTP_STATUS" = "200" ] && EXPECTED_SHA="$EXPECTED_SHA" RESPONSE="$RESPONSE" node - <<'NODE'
          const expected = process.env.EXPECTED_SHA;
          try {
            const body = JSON.parse(process.env.RESPONSE || "");
            process.exit(body.status === "ok" && body.commit === expected ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
            then
              echo "Health check passed for $EXPECTED_SHA"
              exit 0
            fi

            NOW="$(date +%s)"
            REMAINING="$((HEALTH_DEADLINE - NOW))"
            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            SLEEP_SECONDS=2
            if [ "$SLEEP_SECONDS" -gt "$REMAINING" ]; then
              SLEEP_SECONDS="$REMAINING"
            fi
            echo "Health check pending (attempt $ATTEMPT; http=$LAST_HTTP_STATUS; ${REMAINING}s remaining)" >&2
            sleep "$SLEEP_SECONDS"
          done

          echo "Health check failed for expected SHA $EXPECTED_SHA after 60 seconds (last_http_status=$LAST_HTTP_STATUS)" >&2
          exit 1

  diagnose-service-role:
    name: Diagnose app-beta service_role runtime (read-only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose_service_role' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate diagnostic mode
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ inputs.mode }}" = "diagnose_service_role"

      - name: Configure read-only SSH
        shell: bash
        env:
          APP_BETA_SSH_PORT: ${{ secrets.APP_BETA_SSH_PORT }}
          APP_BETA_SSH_PRIVATE_KEY: ${{ secrets.APP_BETA_SSH_PRIVATE_KEY }}
          APP_BETA_SSH_KNOWN_HOSTS: ${{ secrets.APP_BETA_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${APP_BETA_SSH_PORT:-}"
          test -n "${APP_BETA_SSH_PRIVATE_KEY:-}"
          test -n "${APP_BETA_SSH_KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$APP_BETA_SSH_PRIVATE_KEY" > "$HOME/.ssh/app_beta_diagnose_key"
          printf '%s\n' "$APP_BETA_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Collect runtime evidence (read-only)
        shell: bash
        env:
          APP_BETA_SSH_HOST: ${{ secrets.APP_BETA_SSH_HOST }}
          APP_BETA_SSH_USER: ${{ secrets.APP_BETA_SSH_USER }}
          APP_BETA_SSH_PORT: ${{ secrets.APP_BETA_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/app-beta-service-role-runtime.txt"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/app_beta_diagnose_key" -p "$APP_BETA_SSH_PORT" \
            "$APP_BETA_SSH_USER@$APP_BETA_SSH_HOST" 'bash -s' > "$REPORT" <<'REMOTE'
          set -Eeuo pipefail
          echo '## Runtime service_role diagnostic (read-only)'
          TARGET_CONTAINER='reformando-app-beta'
          INSPECTED_CONTAINERS=()
          echo '## Guard'
          forbidden_container_present=false
          if docker ps -a --format '{{.Names}}' | grep -Fxq 'reformando-beta'; then
            forbidden_container_present=true
          fi
          target_matches="$(docker ps --format '{{.Names}}' | grep -Fx "$TARGET_CONTAINER" || true)"
          target_count="$(printf '%s\n' "$target_matches" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$target_count" -ne 1 ]; then
            echo "ERROR target container count=$target_count expected=1"
            exit 1
          fi
          echo "target_container=$TARGET_CONTAINER"
          echo "forbidden_container_present=$forbidden_container_present"
          echo 'forbidden_container_inspected=false'
          echo 'inspection_scope=reformando-app-beta plus operational metadata'

          echo '## Target container'
          echo "$target_matches" | sed -E 's/^(.*)$/name=\1/'
          docker inspect --format 'name={{.Name}} image={{.Config.Image}} status={{.State.Status}}' "$TARGET_CONTAINER"
          INSPECTED_CONTAINERS+=("$TARGET_CONTAINER")
          TARGET_MOUNTS="$(docker inspect --format '{{range .Mounts}}{{println .Source}}{{end}}' "$TARGET_CONTAINER")"
          INSPECTED_CONTAINERS+=("$TARGET_CONTAINER")
          docker inspect --format '{{range .Mounts}}{{println "mount" .Source "->" .Destination}}{{end}}' "$TARGET_CONTAINER"

          echo '## Target environment variable names (values redacted)'
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$TARGET_CONTAINER" \
            | sed -E 's/=.*$/=[REDACTED]/' \
            | grep -Ei 'SUPABASE|SERVICE_ROLE|DATABASE|APP_|NODE_ENV' \
            | sort -u || true

          echo '## Runtime references (filenames only)'
          service_role_references_found=0
          SEARCH_ROOTS="/docker/reformando-app-beta"
          while IFS= read -r mount; do
            [ -n "$mount" ] && SEARCH_ROOTS="$SEARCH_ROOTS"$'\n'"$mount"
          done <<< "$TARGET_MOUNTS"
          while IFS= read -r root; do
            [ -d "$root" ] || continue
            mapfile -d '' candidate_files < <(timeout 20 find "$root" -type f -readable -size -2M -print0 2>/dev/null)
            if [ "${#candidate_files[@]}" -eq 0 ]; then
              echo "root=$root files=(sin archivos candidatos)"
              continue
            fi
            set +e
            matches="$(grep -IlE 'SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE|service_role|createClient|supabase-js' "${candidate_files[@]}" 2>/dev/null)"
            grep_status=$?
            set -e
            if [ "$grep_status" -gt 1 ]; then
              echo "ERROR file scan failed root=$root status=$grep_status" >&2
              exit "$grep_status"
            fi
            if [ -n "$matches" ]; then
              printf '%s\n' "$matches" | sed -n '1,200p'
              service_role_references_found=$((service_role_references_found + $(printf '%s\n' "$matches" | sed '/^$/d' | wc -l)))
            else
              echo "root=$root files=(sin coincidencias)"
            fi
          done <<< "$SEARCH_ROOTS"
          echo "file_scan_status=completed"
          echo "service_role_references_found=$service_role_references_found"

          echo '## Inferred tables and operations (metadata patterns only)'
          while IFS= read -r root; do
            [ -d "$root" ] || continue
            mapfile -d '' candidate_files < <(timeout 20 find "$root" -type f -readable -size -2M -print0 2>/dev/null)
            [ "${#candidate_files[@]}" -gt 0 ] || continue
            set +e
            matches="$(grep -IhoE '(from|into|update|delete[[:space:]]+from)[[:space:]]+public\\.[a-z_][a-z0-9_]*|\\.from\\([[:space:]]*["'"'"'][a-z_][a-z0-9_]*' "${candidate_files[@]}" 2>/dev/null)"
            grep_status=$?
            set -e
            if [ "$grep_status" -gt 1 ]; then
              echo "ERROR metadata scan failed root=$root status=$grep_status" >&2
              exit "$grep_status"
            fi
            [ -n "$matches" ] && printf '%s\n' "$matches"
          done <<< "$SEARCH_ROOTS" | sed -E 's/.*(from|into|update|delete[[:space:]]+from)[[:space:]]+//; s/.*\\.from\\([[:space:]]*["'"'"']//; s/[^a-z0-9_].*$//' | sort -u | sed -n '1,200p'

          echo '## Cron and systemd references (paths only)'
          mapfile -t operational_files < <(find /etc/cron* /var/spool/cron /etc/systemd/system /usr/lib/systemd/system \
            -type f -readable -print 2>/dev/null)
          for file in "${operational_files[@]}"; do
            set +e
            grep -IlE 'SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE|service_role|supabase' "$file" 2>/dev/null
            grep_status=$?
            set -e
            if [ "$grep_status" -gt 1 ]; then
              echo "ERROR operational file scan failed file=$file status=$grep_status" >&2
              exit "$grep_status"
            fi
          done
          systemctl list-unit-files --no-legend 2>/dev/null | grep -Ei 'supabase|reformando|beta' | sed -E 's/[[:space:]]+/ /g' || true

          echo '## Compose/configuration filenames'
          find /docker/reformando-app-beta -type f \( -iname '*compose*.yml' -o -iname '*compose*.yaml' -o -iname '*.env' -o -iname '*.service' \) \
            -readable -print 2>/dev/null | sort -u | sed -n '1,200p'
          echo '## General operational filenames'
          find /opt /srv /app /etc -maxdepth 4 -type f \( -iname '*service*role*' -o -iname '*supabase*' -o -iname '*reformando*' -o -iname '*.service' \) \
            -readable -print 2>/dev/null | sort -u | sed -n '1,200p'

          echo '## Inspection guard'
          unique_inspected="$(printf '%s\n' "${INSPECTED_CONTAINERS[@]}" | sort -u)"
          if [ "$(printf '%s\n' "$unique_inspected" | sed '/^$/d' | wc -l | tr -d ' ')" -ne 1 ] || [ "$unique_inspected" != "$TARGET_CONTAINER" ]; then
            echo "ERROR inspected container set is not exactly $TARGET_CONTAINER"
            exit 1
          fi
          echo "inspected_containers=$unique_inspected"
          REMOTE
          sed -E 's#(postgres(ql)?://)[^@[:space:]]+@#\1[REDACTED]@#g; s/(key|token|password|secret|authorization)=?[^[:space:]]+/\1=[REDACTED]/gi' "$REPORT" > "$REPORT.sanitized"
          mv "$REPORT.sanitized" "$REPORT"
          test -s "$REPORT"
          {
            echo '## app-beta service_role runtime diagnostic (sanitized)'
            cat "$REPORT"
          } >> "${GITHUB_STEP_SUMMARY:?}"

      - name: Upload runtime diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-beta-service-role-runtime-diagnostic
          path: ${{ runner.temp }}/app-beta-service-role-runtime.txt
          if-no-files-found: error
          retention-days: 2
