name: R1 isolated migration (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only plan or guarded R1 application'
        required: true
        type: choice
        options: [plan_r1, apply_r1]
      confirm_project_ref:
        description: 'Must equal hafljwojvblyfljddjcr'
        required: true
        type: string
      confirm_apply:
        description: 'Confirmación adicional para apply_r1'
        required: false
        default: ''
        type: string
      confirm_workflow_sha:
        description: 'SHA exacto de main autorizado para esta ejecución'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: r1-isolated-migration
  cancel-in-progress: false

env:
  SOURCE_SHA: 1b0bd622123929409953584c2bad70a17a570190
  PROJECT_REF: hafljwojvblyfljddjcr
  R1_TIMESTAMP: 20260801130000
  R1_NAME: 20260801130000_r1_acl_orphan_tables_hardening.sql
  R1_SHA256: 7504d537300afd3ea3dc949787ae06e0a0e64c816dc6195d68241d04fb32b84d

jobs:
  isolated-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout workflow SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize evidence before guards
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r1-isolated"
          {
            echo 'status=started'
            echo "github_ref=$GITHUB_REF"
            echo "actual_workflow_sha=$GITHUB_SHA"
            echo "confirm_workflow_sha=${{ inputs.confirm_workflow_sha }}"
            echo "source_sha=$SOURCE_SHA"
            workflow_file_sha256='unavailable'
            r1_sha256='unavailable'
            [ -f .github/workflows/r1-isolated-migration.yml ] && workflow_file_sha256=$(sha256sum .github/workflows/r1-isolated-migration.yml | awk '{print $1}')
            [ -f supabase/migrations/$R1_NAME ] && r1_sha256=$(sha256sum supabase/migrations/$R1_NAME | awk '{print $1}')
            echo "workflow_file_sha256=$workflow_file_sha256"
            echo "r1_sha256=$r1_sha256"
            echo "project_ref=${{ inputs.confirm_project_ref }}"
            echo 'remote_access_started=false'
            echo 'credentials_loaded=false'
            echo 'cli_installed=false'
          } > "$RUNNER_TEMP/r1-isolated/evidence.txt"

      - name: Validate immutable identities and inputs
        env:
          INPUT_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRM_APPLY: ${{ inputs.confirm_apply }}
          INPUT_WORKFLOW_SHA: ${{ inputs.confirm_workflow_sha }}
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/r1-isolated/evidence.txt"
          fail() { echo "status=failed" >> "$report"; echo "error=$1" >> "$report"; echo 'remote_access_started=false' >> "$report"; exit 1; }
          test "$GITHUB_REF" = 'refs/heads/main' || fail "workflow_ref=$GITHUB_REF expected=refs/heads/main"
          printf '%s\n' "$INPUT_WORKFLOW_SHA" | grep -Eq '^[0-9a-fA-F]{40}$' || fail 'confirm_workflow_sha must be a complete 40-hex SHA-1'
          test "$INPUT_WORKFLOW_SHA" = "$GITHUB_SHA" || fail "workflow_sha=$GITHUB_SHA confirm_workflow_sha=$INPUT_WORKFLOW_SHA"
          test "$INPUT_PROJECT_REF" = "$PROJECT_REF" || fail "project_ref=$INPUT_PROJECT_REF expected=$PROJECT_REF"
          case "$INPUT_MODE" in plan_r1|apply_r1) : ;; *) fail "invalid mode=$INPUT_MODE" ;; esac
          if [ "$INPUT_MODE" = apply_r1 ] && [ "$INPUT_CONFIRM_APPLY" != APPLY_R1_ONLY ]; then
            fail 'apply_r1 requires confirm_apply=APPLY_R1_ONLY'
          fi
          echo 'status=guards_passed' >> "$report"

      - name: Prepare source workspace from immutable SOURCE_SHA
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/r1-isolated/evidence.txt"
          WORK="$(mktemp -d)"
          echo "$WORK" > "$RUNNER_TEMP/r1-isolated/workspace-path.txt"
          git fetch --no-tags origin "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          mkdir -p "$WORK"
          git archive "$SOURCE_SHA" | tar -x -C "$WORK"
          test -f "$WORK/supabase/migrations/$R1_NAME"
          actual_sha=$(sha256sum "$WORK/supabase/migrations/$R1_NAME" | awk '{print $1}')
          test "$actual_sha" = "$R1_SHA256"
          {
            echo "source_sha_verified=$SOURCE_SHA"
            echo "r1_sha256=$actual_sha"
            echo 'source_tree_separated=true'
          } >> "$report"

      - name: Install Supabase CLI
        run: |
          set -euo pipefail
          npm i -g supabase@2
          supabase --version > "$RUNNER_TEMP/r1-isolated/cli-version.txt"
          cat "$RUNNER_TEMP/r1-isolated/cli-version.txt"
          echo 'cli_installed=true' >> "$RUNNER_TEMP/r1-isolated/evidence.txt"

      - name: Plan and optionally apply only R1
        if: ${{ inputs.mode == 'plan_r1' || inputs.mode == 'apply_r1' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          set -Eeuo pipefail
          set +x
          report="$RUNNER_TEMP/r1-isolated/evidence.txt"
          WORK="$(cat "$RUNNER_TEMP/r1-isolated/workspace-path.txt")"
          cleanup() {
            status=$?
            {
              echo "status=$([ "$status" -eq 0 ] && echo completed || echo failed)"
              echo "error=$([ "$status" -eq 0 ] && echo none || echo plan_failed)"
              echo "github_ref=$GITHUB_REF"
              echo "actual_workflow_sha=$GITHUB_SHA"
              echo "confirm_workflow_sha=${{ inputs.confirm_workflow_sha }}"
              echo "source_sha=$SOURCE_SHA"
              echo "workflow_file_sha256=$(sha256sum .github/workflows/r1-isolated-migration.yml | awk '{print $1}')"
              echo "r1_sha256=$R1_SHA256"
              echo 'remote_access_started=true'
              echo 'credentials_loaded=true'
              echo 'cli_installed=true'
              echo "migration_list_completed=$([ -f "$RUNNER_TEMP/r1-isolated/migration-list.raw.txt" ] && echo true || echo false)"
              echo "migration_list_parse_completed=$([ -s "$RUNNER_TEMP/r1-isolated/remote-versions.txt" ] && echo true || echo false)"
              echo "dry_run_completed=$([ -f "$RUNNER_TEMP/r1-isolated/dry-run.stdout.txt" ] && echo true || echo false)"
              echo 'db_push_executed=false'
            } > "$RUNNER_TEMP/r1-isolated/report.txt"
            cp "$RUNNER_TEMP/r1-isolated/report.txt" "$RUNNER_TEMP/r1-isolated/evidence.txt" 2>/dev/null || true
            rm -rf "$WORK"
            exit "$status"
          }
          trap cleanup EXIT
          test -n "$DATABASE_URL"
          echo 'credentials_loaded=true' >> "$report"
          echo 'remote_access_started=true' >> "$report"
          supabase db push --help > "$RUNNER_TEMP/r1-isolated/db-push-help.txt" 2>&1
          grep -F -- '--dry-run' "$RUNNER_TEMP/r1-isolated/db-push-help.txt"
          set +e
          supabase migration list --db-url "$DATABASE_URL" > "$RUNNER_TEMP/r1-isolated/migration-list.raw.txt" 2>&1
          migration_list_status=$?
          set -e
          test "$migration_list_status" -eq 0
          sed -E $'s/\033\\[[0-9;]*[[:alpha:]]//g; s/(postgres(ql)?:\\/\\/)[^@[:space:]]+@/\\1[REDACTED]@/g; s/(key|token|password|secret|authorization)=?[^[:space:]]+/\\1=[REDACTED]/gi' \
            "$RUNNER_TEMP/r1-isolated/migration-list.raw.txt" > "$RUNNER_TEMP/r1-isolated/migration-list.sanitized.txt"
          cp "$RUNNER_TEMP/r1-isolated/migration-list.sanitized.txt" "$RUNNER_TEMP/r1-isolated/migration-list.normalized.txt"
          parser_errors="$RUNNER_TEMP/r1-isolated/parser-errors.txt"
          : > "$parser_errors"
          set +e
          awk -v errors="$parser_errors" '
            function trim(v) { gsub(/^[[:space:]`]+|[[:space:]`]+$/, "", v); return v }
            function valid(v) { return v ~ /^[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]$/ }
            function fail(msg) { print msg > errors; bad=1 }
            BEGIN { header=0; rows=0 }
            {
              line=$0
              gsub(/\r/, "", line)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
              if (line ~ /^[[:space:]]*$/) next
              if (line ~ /^[[:space:]|+_-]+$/) next
              if (!header) {
                if (line ~ /[Ll]ocal/ && line ~ /[Rr]emote/) { header=1; header_has_time=(line ~ /[Tt]ime/); next }
                next
              }
              n=split(line, col, /\|/)
              if (n >= 3) {
                local=trim(col[1]); remote=trim(col[2]); extra=trim(col[3])
                if (n > 3 || (extra != "" && !header_has_time)) fail("unexpected migration row: " line)
              }
              else {
                n=split(line, col, /[[:space:]]+/)
                local=trim(col[1]); remote=trim(col[2])
                if (n != 2) { fail("ambiguous migration row: " line); next }
              }
              if (local == "" && remote == "") next
              if (!valid(local)) { fail("invalid local migration version: " local); next }
              if (!valid(remote)) { fail("invalid remote migration version: " remote); next }
              rows++
              if (seen[remote]++) fail("duplicate remote migration version: " remote)
              print remote
            }
            END {
              if (!header) fail("remote migration column not identified")
              if (header && rows == 0) fail("remote migration history is empty or unparseable")
              exit bad ? 1 : 0
            }
          ' "$RUNNER_TEMP/r1-isolated/migration-list.sanitized.txt" > "$RUNNER_TEMP/r1-isolated/remote-versions.unsorted.txt"
          parser_status=$?
          set -e
          test "$parser_status" -eq 0
          sort "$RUNNER_TEMP/r1-isolated/remote-versions.unsorted.txt" > "$RUNNER_TEMP/r1-isolated/remote-versions.txt"
          test -s "$RUNNER_TEMP/r1-isolated/remote-versions.txt"
          awk 'length($0) != 14 || $0 !~ /^[0-9]+$/ { exit 1 }' "$RUNNER_TEMP/r1-isolated/remote-versions.txt"
          mapfile -t remote_timestamps < "$RUNNER_TEMP/r1-isolated/remote-versions.txt"
          test "${#remote_timestamps[@]}" -gt 0
          find "$WORK/supabase/migrations" -maxdepth 1 -type f -printf '%f\n' | sed -E 's/^([0-9]{14})_.*/\1/' | sort | uniq -d > "$RUNNER_TEMP/r1-isolated/local-duplicate-versions.txt"
          test ! -s "$RUNNER_TEMP/r1-isolated/local-duplicate-versions.txt"
          : > "$RUNNER_TEMP/r1-isolated/remote-version-map.txt"
          for timestamp in "${remote_timestamps[@]}"; do
            mapfile -t matches < <(find "$WORK/supabase/migrations" -maxdepth 1 -name "${timestamp}_*.sql" -printf '%f\n' | sort)
            test "${#matches[@]}" -eq 1
            test -f "$WORK/supabase/migrations/${matches[0]}"
            mkdir -p "$WORK/supabase/migrations-min"
            cp "$WORK/supabase/migrations/${matches[0]}" "$WORK/supabase/migrations-min/${matches[0]}"
            printf 'remote_version=%s\nlocal_file=%s\n' "$timestamp" "${matches[0]}" >> "$RUNNER_TEMP/r1-isolated/remote-version-map.txt"
          done
          mkdir -p "$WORK/supabase/migrations-min"
          cp "$WORK/supabase/migrations/$R1_NAME" "$WORK/supabase/migrations-min/$R1_NAME"
          find "$WORK/supabase/migrations" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/r1-isolated/all-local-migrations.txt"
          find "$WORK/supabase/migrations" -maxdepth 1 -type f -printf '%f\n' | sort | grep -v -F -f <(cat "$RUNNER_TEMP/r1-isolated/remote-version-map.txt" | sed -n 's/^local_file=//p') | grep -v -Fx "$R1_NAME" > "$RUNNER_TEMP/r1-isolated/excluded-local-migrations.txt" || true
          rm -rf "$WORK/supabase/migrations"
          mv "$WORK/supabase/migrations-min" "$WORK/supabase/migrations"
          {
            echo "remote_migration_count=${#remote_timestamps[@]}"
            cat "$RUNNER_TEMP/r1-isolated/remote-version-map.txt"
            echo "r1=$R1_NAME"
            echo "r1_sha256=$R1_SHA256"
            echo 'final_files:'
            find "$WORK/supabase/migrations" -maxdepth 1 -type f -printf '%f\n' | sort
            echo 'excluded_local_migrations:'
            cat "$RUNNER_TEMP/r1-isolated/excluded-local-migrations.txt"
          } > "$RUNNER_TEMP/r1-isolated/workspace-manifest.txt"
          pushd "$WORK" >/dev/null
          supabase db push --dry-run --db-url "$DATABASE_URL" > "$RUNNER_TEMP/r1-isolated/dry-run.stdout.txt" 2> "$RUNNER_TEMP/r1-isolated/dry-run.stderr.txt"
          popd >/dev/null
          cat "$RUNNER_TEMP/r1-isolated/dry-run.stderr.txt" >> "$RUNNER_TEMP/r1-isolated/dry-run.stdout.txt"
          mapfile -t planned_timestamps < <(grep -Eo '[0-9]{14}' "$RUNNER_TEMP/r1-isolated/dry-run.stdout.txt" | sort -u)
          test "${#planned_timestamps[@]}" -eq 1
          test "${planned_timestamps[0]}" = "$R1_TIMESTAMP"
          if grep -Eqi 'diverg|warning|R2|R2\.1|M1|M2|M3|M4' "$RUNNER_TEMP/r1-isolated/dry-run.stdout.txt"; then exit 1; fi
          printf 'count=1\ntimestamp=%s\nname=%s\n' "$R1_TIMESTAMP" "$R1_NAME" > "$RUNNER_TEMP/r1-isolated/parsed-plan.txt"
          grep -F 'count=1' "$RUNNER_TEMP/r1-isolated/parsed-plan.txt"
          if [ "${{ inputs.mode }}" = apply_r1 ]; then
            pushd "$WORK" >/dev/null
            supabase db push --db-url "$DATABASE_URL" > "$RUNNER_TEMP/r1-isolated/apply.txt" 2>&1
            popd >/dev/null
          fi
          echo 'status=completed' >> "$report"

      - name: Upload isolated R1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-isolated-migration-plan
          path: ${{ runner.temp }}/r1-isolated
          retention-days: 7
          if-no-files-found: error
