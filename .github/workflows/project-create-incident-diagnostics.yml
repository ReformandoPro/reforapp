name: Project create incident diagnostics

on:
  push:
    branches:
      - fix/project-create-post-merge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-create-incident-diagnostics
  cancel-in-progress: false

jobs:
  app-beta-runtime:
    name: Inspect app-beta runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate app-beta diagnostics configuration
        env:
          APP_BETA_SSH_HOST: ${{ secrets.APP_BETA_SSH_HOST }}
          APP_BETA_SSH_USER: ${{ secrets.APP_BETA_SSH_USER }}
          APP_BETA_SSH_PORT: ${{ secrets.APP_BETA_SSH_PORT }}
          APP_BETA_SSH_PRIVATE_KEY: ${{ secrets.APP_BETA_SSH_PRIVATE_KEY }}
          APP_BETA_SSH_KNOWN_HOSTS: ${{ secrets.APP_BETA_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for variable in APP_BETA_SSH_HOST APP_BETA_SSH_USER APP_BETA_SSH_PORT APP_BETA_SSH_PRIVATE_KEY APP_BETA_SSH_KNOWN_HOSTS; do
            [ -n "${!variable:-}" ] || { echo "Missing required secret: $variable" >&2; exit 1; }
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.APP_BETA_SSH_PRIVATE_KEY }}" > ~/.ssh/app_beta_diagnostics_key
          chmod 600 ~/.ssh/app_beta_diagnostics_key
          printf '%s\n' "${{ secrets.APP_BETA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect deployed SHA and sanitized project logs
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/app_beta_diagnostics_key -p "${{ secrets.APP_BETA_SSH_PORT }}" "${{ secrets.APP_BETA_SSH_USER }}@${{ secrets.APP_BETA_SSH_HOST }}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          REPO="/docker/openclaw-ejvk/data/apps/reformando-app"
          COMPOSE="/docker/reformando-app-beta"
          SERVICE="reformando-app-beta"
          test -d "$REPO"
          test -d "$COMPOSE"

          echo "runtime:repo_sha=$(git -C "$REPO" rev-parse HEAD)"
          container_id="$(cd "$COMPOSE" && docker compose ps -q "$SERVICE")"
          [ -n "$container_id" ] || { echo 'runtime:container=missing'; exit 1; }
          echo "runtime:container_id=${container_id:0:12}"
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container_id" \
            | grep '^GIT_COMMIT_SHA=' \
            | sed 's/^/runtime:/'
          docker inspect --format 'runtime:started_at={{.State.StartedAt}} runtime:status={{.State.Status}}' "$container_id"

          echo 'runtime:relevant_logs_begin'
          (cd "$COMPOSE" && docker compose logs --since=6h --tail=1000 "$SERVICE") 2>&1 \
            | grep -Ei 'project|supabase|permission denied|schema cache|column .* does not exist|relation .* does not exist|error' \
            | sed -E 's#(https://)[^[:space:]]+#\1[REDACTED]#g; s#(eyJ)[A-Za-z0-9._-]+#[REDACTED]#g' \
            | tail -200 || true
          echo 'runtime:relevant_logs_end'
          REMOTE

  beta-schema:
    name: Inspect Supabase beta schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate database diagnostics configuration
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "${SUPABASE_STAGING_DB_URL:-}" ] || { echo 'Missing SUPABASE_STAGING_DB_URL' >&2; exit 1; }
          echo "::add-mask::$SUPABASE_STAGING_DB_URL"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -y >/dev/null && sudo apt-get install -y postgresql-client >/dev/null; }

      - name: Inspect migrations, columns, grants and policies
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          psql "$SUPABASE_STAGING_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off
          select 'migration' as check_type, version
          from supabase_migrations.schema_migrations
          where version in ('20260728090000', '20260728090100', '20260728100000')
          order by version;

          select 'column' as check_type, column_name, data_type, is_nullable
          from information_schema.columns
          where table_schema = 'public'
            and table_name = 'projects'
            and column_name in (
              'id', 'organization_id', 'client_id', 'name', 'status', 'address',
              'type', 'progress', 'client_name', 'created_at', 'updated_at',
              'description', 'start_date', 'expected_end_date'
            )
          order by ordinal_position;

          select 'grant' as check_type,
                 has_table_privilege('authenticated', 'public.memberships', 'select') as memberships_select,
                 has_table_privilege('authenticated', 'public.projects', 'select') as projects_select,
                 has_table_privilege('authenticated', 'public.projects', 'insert') as projects_insert,
                 has_table_privilege('authenticated', 'public.project_tasks', 'select') as tasks_select,
                 has_table_privilege('authenticated', 'public.project_tasks', 'insert') as tasks_insert;

          select 'policy' as check_type, tablename, policyname, cmd, roles
          from pg_policies
          where schemaname = 'public'
            and tablename in ('memberships', 'projects', 'project_tasks')
          order by tablename, policyname;

          select 'constraint' as check_type, conname, pg_get_constraintdef(oid) as definition
          from pg_constraint
          where conrelid = 'public.projects'::regclass
          order by conname;
          SQL

      - name: Execute exact project list projection as authenticated role
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        shell: bash
        run: |
          set +e
          output="$(psql "$SUPABASE_STAGING_DB_URL" -X -v ON_ERROR_STOP=1 -Atqc "begin; set local role authenticated; select id, organization_id, client_id, name, status, address, type, progress, client_name, created_at, updated_at from public.projects order by updated_at desc limit 0; rollback;" 2>&1)"
          status=$?
          sanitized="$(printf '%s' "$output" | sed -E 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g')"
          echo "query:exit_code=$status"
          printf '%s\n' "$sanitized"
          exit 0
