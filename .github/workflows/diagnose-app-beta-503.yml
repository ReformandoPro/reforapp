name: Diagnose app-beta HTTP 503 (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-app-beta-503
  cancel-in-progress: false

env:
  TARGET_CONTAINER: reformando-app-beta
  FORBIDDEN_CONTAINER: reformando-beta
  APP_BETA_HOST: app-beta.reformando.pro

jobs:
  diagnose:
    name: Runtime read-only diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Create artifact evidence directory early
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app-beta-503"
          : > "$RUNNER_TEMP/app-beta-503/report.txt"
          cat > "$RUNNER_TEMP/app-beta-503/report.txt" <<'REPORT'
          app-beta HTTP 503 runtime diagnostic
          mode=read-only
          target_container=reformando-app-beta
          forbidden_container=reformando-beta
          inspected_containers=reformando-app-beta
          REPORT

      - name: Validate secrets without printing values
        shell: bash
        env:
          APP_BETA_SSH_HOST: ${{ secrets.APP_BETA_SSH_HOST }}
          APP_BETA_SSH_USER: ${{ secrets.APP_BETA_SSH_USER }}
          APP_BETA_SSH_PORT: ${{ secrets.APP_BETA_SSH_PORT }}
          APP_BETA_SSH_PRIVATE_KEY: ${{ secrets.APP_BETA_SSH_PRIVATE_KEY }}
          APP_BETA_SSH_KNOWN_HOSTS: ${{ secrets.APP_BETA_SSH_KNOWN_HOSTS }}
          APP_BETA_HEALTH_USERNAME: ${{ secrets.APP_BETA_HEALTH_USERNAME }}
          APP_BETA_HEALTH_PASSWORD: ${{ secrets.APP_BETA_HEALTH_PASSWORD }}
        run: |
          set +x
          missing=0
          for variable in APP_BETA_SSH_HOST APP_BETA_SSH_USER APP_BETA_SSH_PORT APP_BETA_SSH_PRIVATE_KEY APP_BETA_SSH_KNOWN_HOSTS APP_BETA_HEALTH_USERNAME APP_BETA_HEALTH_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing required secret: $variable"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Configure read-only SSH
        shell: bash
        env:
          APP_BETA_SSH_PRIVATE_KEY: ${{ secrets.APP_BETA_SSH_PRIVATE_KEY }}
          APP_BETA_SSH_KNOWN_HOSTS: ${{ secrets.APP_BETA_SSH_KNOWN_HOSTS }}
        run: |
          set +x
          mkdir -p "$RUNNER_TEMP/ssh"
          chmod 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$APP_BETA_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$APP_BETA_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Runtime evidence over SSH (read-only)
        shell: bash
        env:
          APP_BETA_SSH_HOST: ${{ secrets.APP_BETA_SSH_HOST }}
          APP_BETA_SSH_USER: ${{ secrets.APP_BETA_SSH_USER }}
          APP_BETA_SSH_PORT: ${{ secrets.APP_BETA_SSH_PORT }}
          APP_BETA_HEALTH_USERNAME: ${{ secrets.APP_BETA_HEALTH_USERNAME }}
          APP_BETA_HEALTH_PASSWORD: ${{ secrets.APP_BETA_HEALTH_PASSWORD }}
        run: |
          set +x
          set -u
          OUT="$RUNNER_TEMP/app-beta-503"
          SSH=(ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -i "$RUNNER_TEMP/ssh/key" -p "$APP_BETA_SSH_PORT" "$APP_BETA_SSH_USER@$APP_BETA_SSH_HOST")
          remote() { "${SSH[@]}" "$@"; }
          export TARGET_CONTAINER FORBIDDEN_CONTAINER APP_BETA_HOST

          remote 'set -euo pipefail
            TARGET_CONTAINER="reformando-app-beta"
            FORBIDDEN_CONTAINER="reformando-beta"
            names=$(docker ps --format "{{.Names}}")
            count=$(printf "%s\n" "$names" | awk -v t="$TARGET_CONTAINER" "$0 == t { n++ } END { print n+0 }")
            test "$count" -eq 1
            printf "target_present=true\nforbidden_present=%s\n" "$(printf "%s\n" "$names" | grep -Fxq "$FORBIDDEN_CONTAINER" && echo true || echo false)"
            printf "inspected_containers=%s\n" "$TARGET_CONTAINER"
            docker inspect "$TARGET_CONTAINER" >/dev/null
            docker stats --no-stream "$TARGET_CONTAINER" >/dev/null
            docker logs --since 6h --timestamps "$TARGET_CONTAINER" >/dev/null
          ' > "$OUT/guard-report.txt" 2>&1

          remote 'docker inspect --format "{{json .}}" "$TARGET_CONTAINER"' 2> "$OUT/container-inspect-errors.txt" \
            | jq '.[0] // .' > "$OUT/container-inspect.raw.json"
          jq 'del(.Config.Env) | .Config += {"Env": ((.Config.Env // []) | map(split("=",2)[0] + "=[REDACTED]"))} | .State.Health.Log = ((.State.Health.Log // []) | map(del(.Output) + {Output:"[REDACTED]"})) | .Mounts = (.Mounts // []) | map(. + {Source:"[REDACTED]"})' \
            "$OUT/container-inspect.raw.json" > "$OUT/container-inspect.txt"
          jq '.State.Health // {Status:"none"}' "$OUT/container-inspect.raw.json" \
            | jq 'if .Log then .Log |= map(del(.Output) + {Output:"[REDACTED]"}) else . end' > "$OUT/container-health.txt"

          remote 'docker stats --no-stream --format "{{json .}}" "$TARGET_CONTAINER"' \
            > "$OUT/container-stats.txt" 2>&1
          remote 'set -o pipefail; { free -m; uptime; df -h; (cat /proc/pressure/memory || true); (journalctl -k --since "6 hours ago" --no-pager 2>/dev/null || true) | grep -Ei "oom|out of memory|killed process|reforming-app-beta" || true; }' \
            > "$OUT/host-metrics.txt" 2>&1

          remote 'docker logs --since 6h --timestamps "$TARGET_CONTAINER" 2>/dev/null' \
            | sed -E 's/(Authorization:|authorization:|Bearer[[:space:]]+|cookie:|Cookie:|jwt|token|password|secret|service_role|anon|postgres(ql)?:\/\/)[^[:space:]]*/\1[REDACTED]/Ig; s/[?&](token|code|key|password|secret)=[^&[:space:]]+/\1=[REDACTED]/Ig; s/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/[EMAIL_REDACTED]/g' \
            > "$OUT/app-logs-sanitized.txt" 2> "$OUT/app-logs-stderr.txt"
          grep -Ein -C 3 '503|500|timeout|ECONNRESET|ETIMEDOUT|fetch failed|supabase|postgrest|postgresql|connection|pool|too many clients|out of memory|killed|unhandled|redirect|revalidate|server action|digest|RSC' "$OUT/app-logs-sanitized.txt" \
            > "$OUT/app-error-summary.txt" || true

          traefik=$(
            remote 'docker ps --format "{{.Names}}\\t{{.Labels}}"' \
              | awk -F '\t' '$0 ~ /traefik\.enable=true/ { print $1 }'
          )
          if [ "$(printf '%s\n' "$traefik" | sed '/^$/d' | wc -l)" -eq 1 ]; then
            printf 'traefik_container=%s\n' "$traefik" > "$OUT/traefik-guard.txt"
            remote "docker logs --since 6h --timestamps \"$traefik\" 2>/dev/null" \
              | grep -Ei 'app-beta\.reformando\.pro| 5[0-9][0-9] |upstream|duration|retry|timeout|router|service' \
              | sed -E 's/(Authorization:|authorization:|Bearer[[:space:]]+|cookie:|Cookie:|jwt|token|password|secret|service_role|anon|postgres(ql)?:\/\/)[^[:space:]]*/\1[REDACTED]/Ig; s/[?&](token|code|key|password|secret)=[^&[:space:]]+/\1=[REDACTED]/Ig' \
              > "$OUT/traefik-logs-sanitized.txt" || true
          else
            printf 'traefik_not_verifiable=true\n' > "$OUT/traefik-logs-sanitized.txt"
          fi

          : > "$OUT/http-probes.txt"
          : > "$OUT/correlation.csv"
          printf 'timestamp|route/event|HTTP status|emitter|upstream|duration|related error\n' > "$OUT/correlation.csv"
          for route in /api/health /login /api/projects; do
            timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            result=$(curl -sS --max-time 15 -o /dev/null -D "$OUT/headers.tmp" -u "$APP_BETA_HEALTH_USERNAME:$APP_BETA_HEALTH_PASSWORD" \
              -w 'status=%{http_code} duration=%{time_total} connect=%{time_connect} ttfb=%{time_starttransfer}\n' "https://$APP_BETA_HOST$route" 2>&1 || true)
            server=$(awk -F': ' 'tolower($1)=="server" {print $2}' "$OUT/headers.tmp" | tr -d '\r' | head -1)
            request_id=$(awk -F': ' 'tolower($1) ~ /^(x-request-id|traceparent)$/ {print $2}' "$OUT/headers.tmp" | tr -d '\r' | head -1)
            printf '%s route=%s %s server=%s request_id=%s\n' "$timestamp" "$route" "$result" "${server:-unknown}" "${request_id:-unknown}" >> "$OUT/http-probes.txt"
            status=$(printf '%s' "$result" | sed -n 's/.*status=\([^ ]*\).*/\1/p')
            duration=$(printf '%s' "$result" | sed -n 's/.*duration=\([^ ]*\).*/\1/p')
            printf '%s|%s|%s|probe|unknown|%s|%s\n' "$timestamp" "$route" "${status:-000}" "${duration:-unknown}" "${status:-000}" >> "$OUT/correlation.csv"
            rm -f "$OUT/headers.tmp"
            sleep 1
          done

          cat >> "$OUT/report.txt" <<REPORT
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          verdict=F_CAUSE_NO_CONCLUYENTE
          remote_write=false
          workflow_mode=read-only
          REPORT

      - name: Validate evidence and sanitization fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/app-beta-503"
          test -s "$OUT/report.txt"
          test "$(grep -c '^inspected_containers=reformando-app-beta$' "$OUT/guard-report.txt" || true)" -eq 1
          ! grep -Eiq 'docker (exec|restart|stop|start|compose|cp)|git pull|db_push|migration repair|--include-all|seed' .github/workflows/diagnose-app-beta-503.yml
          printf 'fixture=Authorization: [REDACTED]; email=[EMAIL_REDACTED]\n' | sed -E 's/(Authorization:|Bearer[[:space:]]+|email=)[^; ]*/\1[REDACTED]/Ig' | grep -Fq '[REDACTED]'
          find "$OUT" -maxdepth 1 -type f -size +0c -print > "$OUT/evidence-files.txt"
          test "$(wc -l < "$OUT/evidence-files.txt")" -ge 1

      - name: Upload runtime diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-beta-503-runtime-diagnostic
          path: ${{ runner.temp }}/app-beta-503
          retention-days: 7
          if-no-files-found: error
