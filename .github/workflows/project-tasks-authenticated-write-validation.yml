name: Project tasks authenticated write validation

on:
  pull_request:
    paths:
      - 'src/app/projects/[id]/actions.ts'
      - 'src/app/projects/[id]/page.tsx'
      - 'src/components/tasks/CreateProjectTaskForm.tsx'
      - 'src/components/tasks/index.ts'
      - 'src/lib/services/project-operational-permissions.ts'
      - 'src/lib/services/project-task-create.ts'
      - 'tests/app/project-task-create-action.test.ts'
      - 'tests/app/project-tasks-page.test.ts'
      - 'tests/components/create-project-task-form.test.ts'
      - 'tests/services/project-operational-permissions.test.ts'
      - 'tests/services/project-task-create.test.ts'
      - 'scripts/ci/project-tasks-authenticated-write.mjs'
      - 'supabase/migrations/20260730103000_authenticated_project_write_grants.sql'
      - 'supabase/rollbacks/20260730103000_authenticated_project_write_grants.rollback.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-project-task-write:
    name: Ephemeral Supabase authenticated project task write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_FIXTURE_PASSWORD: 'CI-only-password-123456789!'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR functional scope
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n '${{ github.event.pull_request.base.sha }}' ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base="$(git rev-parse 'origin/${{ github.event.repository.default_branch }}')"
          fi
          head='${{ github.event.pull_request.head.sha || github.sha }}'
          allowed='src/app/app/projects/[id]/page.tsx
          src/app/app/projects/new/CreateProjectForm.tsx
          src/app/app/projects/new/actions.ts
          src/app/app/projects/new/page.tsx
          src/app/app/projects/new/state.ts
          src/app/projects/[id]/actions.ts
          src/app/projects/[id]/page.tsx
          src/app/projects/[id]/state.ts
          src/components/tasks/CreateProjectTaskForm.tsx
          src/components/tasks/index.ts
          src/lib/data/projects.ts
          src/lib/services/project-create.ts
          src/lib/services/private-projects.ts
          src/lib/services/project-operational-permissions.ts
          src/lib/services/project-task-create.ts
          tests/app/project-create-action.test.ts
          tests/app/project-task-create-action.test.ts
          tests/app/projects-page-actions.test.ts
          tests/app/project-tasks-page.test.ts
          tests/components/create-project-form.test.ts
          tests/components/create-project-task-form.test.ts
          tests/data/project-tasks.test.ts
          tests/services/project-create.test.ts
          tests/services/private-projects.test.ts
          tests/services/project-operational-permissions.test.ts
          tests/services/project-task-create.test.ts
          scripts/ci/project-tasks-authenticated-write.mjs
          supabase/migrations/20260730103000_authenticated_project_write_grants.sql
          supabase/rollbacks/20260730103000_authenticated_project_write_grants.rollback.sql
          .github/workflows/project-create-incident-deploy.yml
          .github/workflows/project-tasks-authenticated-write-validation.yml
          .github/workflows/projects-authenticated-read-validation.yml
          .github/workflows/projects-authenticated-write-validation.yml'
          while IFS= read -r -d '' status; do
            case "$status" in
              R*|C*)
                IFS= read -r -d '' source
                IFS= read -r -d '' destination
                echo "Renames and copies are not allowed in authenticated project task write scope: $source -> $destination" >&2
                exit 1
                ;;
              *)
                IFS= read -r -d '' file
                if ! grep -qxF "$file" <<< "$allowed"; then
                  echo "Unexpected file outside authenticated project task write scope: $file" >&2
                  exit 1
                fi
                ;;
            esac
          done < <(git diff --name-status -z --find-renames --find-copies "$base...$head")
          git diff --check "$base...$head"
          allowed_migrations='supabase/migrations/20260730103000_authenticated_project_write_grants.sql'
          while IFS= read -r -d '' status; do
            case "$status" in
              R*|C*)
                IFS= read -r -d '' source
                IFS= read -r -d '' destination
                echo "Renames and copies are not allowed for migrations: $source -> $destination" >&2
                exit 1
                ;;
              *)
                IFS= read -r -d '' migration
                case "$migration" in
                  supabase/migrations/*)
                    if ! grep -qxF "$migration" <<< "$allowed_migrations"; then
                      echo "Unexpected migration outside authenticated project task write scope: $migration" >&2
                      exit 1
                    fi
                    ;;
                esac
                ;;
            esac
          done < <(git diff --name-status -z --find-renames --find-copies "$base...$head")
          allowed_rollbacks='supabase/rollbacks/20260730103000_authenticated_project_write_grants.rollback.sql'
          while IFS= read -r -d '' status; do
            case "$status" in
              R*|C*)
                IFS= read -r -d '' source
                IFS= read -r -d '' destination
                echo "Renames and copies are not allowed for rollbacks: $source -> $destination" >&2
                exit 1
                ;;
              *)
                IFS= read -r -d '' rollback
                case "$rollback" in
                  supabase/rollbacks/*)
                    if ! grep -qxF "$rollback" <<< "$allowed_rollbacks"; then
                      echo "Unexpected rollback outside authenticated project task write scope: $rollback" >&2
                      exit 1
                    fi
                    ;;
                esac
                ;;
            esac
          done < <(git diff --name-status -z --find-renames --find-copies "$base...$head")
          if git diff "$base...$head" -- src | grep -E 'NEXT_PUBLIC_ORGANIZATION_ID|service_role'; then
            echo 'Forbidden public organization or service-role pattern detected in application code.' >&2
            exit 1
          fi
          remote_supabase_pattern='supabase[[:space:]]+(link|db[[:space:]]+push)'
          ignored_error_pattern='continue-on''-error'
          if git diff "$base...$head" -- . | grep -E "$remote_supabase_pattern|$ignored_error_pattern"; then
            echo 'Forbidden remote migration or ignored-error pattern detected.' >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.39.2

      - name: Start ephemeral Supabase and apply local migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          supabase start >/dev/null
          supabase db reset --local --no-seed

      - name: Export local Supabase environment
        shell: bash
        run: |
          set -Eeuo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          read_env_value() {
            local key="$1" value
            value=$(awk -F= -v key="$key" '$1 == key {sub(/^[^=]*=/, ""); gsub(/^"|"$/, ""); print}' "$RUNNER_TEMP/supabase.env")
            [ -n "$value" ] || { echo "Missing local Supabase value: $key" >&2; exit 1; }
            printf '%s' "$value"
          }
          supabase_url=$(read_env_value API_URL)
          supabase_anon_key=$(read_env_value ANON_KEY)
          supabase_service_role_key=$(read_env_value SERVICE_ROLE_KEY)
          echo "::add-mask::$supabase_anon_key"
          echo "::add-mask::$supabase_service_role_key"
          {
            echo "SUPABASE_URL=$supabase_url"
            echo "SUPABASE_ANON_KEY=$supabase_anon_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$supabase_service_role_key"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/supabase.env"

      - name: Create authenticated write fixtures
        run: node scripts/ci/project-tasks-authenticated-write.mjs --fixtures

      - name: Verify authorized task insertion
        run: node scripts/ci/project-tasks-authenticated-write.mjs --authorized

      - name: Verify denied and isolated insertions
        run: node scripts/ci/project-tasks-authenticated-write.mjs --denied

      - name: Run application validation
        run: |
          npx tsc --noEmit --incremental false
          npm run lint
          npm run test -- tests/services/project-task-create.test.ts tests/services/project-operational-permissions.test.ts tests/app/project-task-create-action.test.ts tests/app/project-tasks-page.test.ts tests/components/create-project-task-form.test.ts
          npm run build

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
