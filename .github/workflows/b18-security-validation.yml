name: B18 security validation

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/rollbacks/**'
      - 'supabase/validation/**'
      - '.github/workflows/b18-security-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PostgreSQL B18 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: b18-test-only
          POSTGRES_DB: reformando_b18
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reformando_b18"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: b18-test-only
      PGDATABASE: reformando_b18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository diff
        shell: bash
        run: |
          set -Eeuo pipefail
          phase='Validate repository diff'
          trap 'status=$?; echo "ERROR phase=$phase command=$BASH_COMMAND status=$status line=$LINENO" >&2' ERR
          echo "=== $phase ==="
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'; head='${{ github.event.pull_request.head.sha }}'
          else
            base='HEAD^'; head='HEAD'
          fi
          echo "base=$base"; echo "head=$head"
          echo 'Files detected:'; git diff --name-only "$base...$head"
          echo 'Checking whitespace errors:'; git diff --check "$base...$head"

      - name: Bootstrap PostgreSQL roles and schemas
        shell: bash
        run: |
          set -Eeuo pipefail
          phase='Bootstrap PostgreSQL roles and schemas'
          trap 'status=$?; echo "ERROR phase=$phase command=$BASH_COMMAND status=$status line=$LINENO" >&2' ERR
          echo "=== $phase ==="
          echo 'Executing supabase/test/bootstrap_supabase_test_environment.sql'
          psql -X -a -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -f supabase/test/bootstrap_supabase_test_environment.sql

      - name: Apply historical migrations
        id: apply_historical_migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          phase='Apply historical migrations'
          current_migration='unknown'
          log_file="$RUNNER_TEMP/b18-historical-migration.log"
          trap 'status=$?; echo "ERROR phase=$phase command=$BASH_COMMAND status=$status line=$LINENO" >&2' ERR
          echo "=== $phase ==="
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          for migration in "${migrations[@]}"; do
            case "$migration" in
              20260728090000_b18_rls_helpers_and_issue_security.sql|20260728090100_b18_table_grants.sql) continue ;;
            esac
            current_migration="supabase/migrations/$migration"
            : > "$log_file"
            echo '=================================================='
            echo "Executing historical migration: $current_migration"
            echo '=================================================='
            set +e
            psql -X -a -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -f "$current_migration" 2>&1 | tee "$log_file"
            psql_status=${PIPESTATUS[0]}
            set -e
            if [ "$psql_status" -ne 0 ]; then
              echo "::error file=$current_migration,title=B18 historical migration failed::Migration $current_migration failed with psql status $psql_status"
              {
                echo '## B18 historical migration failure'
                echo
                echo "- Migration: \`$current_migration\`"
                echo "- psql status: \`$psql_status\`"
                echo
                echo '```text'
                tail -n 200 "$log_file"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$psql_status"
            fi
          done

      - name: Upload historical migration failure log
        if: steps.apply_historical_migrations.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: b18-historical-migration-failure
          path: ${{ runner.temp }}/b18-historical-migration.log
          if-no-files-found: error
          retention-days: 7

      - name: Capture B18 baseline
        id: capture_b18_baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          phase='Capture B18 baseline'
          baseline_file='supabase/validation/b18-security-baseline.sql'
          log_file="$RUNNER_TEMP/b18-baseline-failure.log"
          trap 'status=$?; echo "ERROR phase=$phase file=$baseline_file command=$BASH_COMMAND status=$status line=$LINENO" >&2' ERR
          : > "$log_file"
          echo '=================================================='
          echo "Executing B18 baseline: $baseline_file"
          echo '=================================================='
          set +e
          psql -X -a -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -f "$baseline_file" 2>&1 | tee "$log_file"
          psql_status=${PIPESTATUS[0]}
          set -e
          if [ "$psql_status" -ne 0 ]; then
            echo "::error file=$baseline_file,title=B18 baseline capture failed::Baseline capture failed with psql status $psql_status"
            {
              echo '## B18 baseline capture failure'
              echo
              echo "- File: \`$baseline_file\`"
              echo "- psql status: \`$psql_status\`"
              echo
              echo '```text'
              tail -n 200 "$log_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$psql_status"
          fi

      - name: Upload B18 baseline failure log
        if: steps.capture_b18_baseline.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: b18-baseline-failure
          path: ${{ runner.temp }}/b18-baseline-failure.log
          if-no-files-found: error
          retention-days: 7

      - name: Apply B18 migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          phase='Apply B18 migrations'
          trap 'status=$?; echo "ERROR phase=$phase command=$BASH_COMMAND status=$status line=$LINENO" >&2' ERR
          echo "=== $phase ==="
          for file in supabase/migrations/20260728090000_b18_rls_helpers_and_issue_security.sql supabase/migrations/20260728090100_b18_table_grants.sql; do
            echo "Executing $file"
            psql -X -a -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -f "$file"
          done

      - name: Validate B18 apply
        id: validate_b18_apply
        shell: bash
        run: |
          set -Eeuo pipefail
          phase='Validate B18 apply'
          validation_file='supabase/validation/b18-security-rls.sql'
          log_file="$RUNNER_TEMP/b18-apply-validation-failure.log"
          trap 'status=$?; echo "ERROR phase=$phase file=$validation_file command=$BASH_COMMAND status=$status line=$LINENO" >&2' ERR
          : > "$log_file"
          echo '=================================================='
          echo "Executing B18 apply validation: $validation_file"
          echo '=================================================='
          set +e
          psql -X -a -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -f "$validation_file" 2>&1 | tee "$log_file"
          psql_status=${PIPESTATUS[0]}
          set -e
          if [ "$psql_status" -ne 0 ]; then
            echo "::error file=$validation_file,title=B18 apply validation failed::Apply validation failed with psql status $psql_status"
            {
              echo '## B18 apply validation failure'
              echo
              echo "- File: \`$validation_file\`"
              echo "- psql status: \`$psql_status\`"
              echo
              echo '```text'
              tail -n 200 "$log_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$psql_status"
          fi

      - name: Upload B18 apply validation failure log
        if: steps.validate_b18_apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: b18-apply-validation-failure
          path: ${{ runner.temp }}/b18-apply-validation-failure.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify B18 reapply rejection
        shell: bash
        run: |
          set -Eeuo pipefail
          phase='Verify B18 reapply rejection'
          trap 'status=$?; echo "ERROR phase=$phase command=$BASH_COMMAND status=$status line=$LINENO" >&2' ERR
          echo "=== $phase ==="
          echo 'Executing expected-rejection reapply of supabase/migrations/20260728090100_b18_table_grants.sql'
          if psql -X -a -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -f supabase/migrations/20260728090100_b18_table_grants.sql; then
            echo 'B18 snapshot reapply unexpectedly succeeded' >&2; exit 1
          else
            status=$?; echo "B18 snapshot reapply rejected as expected with psql status=$status; original snapshot preserved"
          fi

      - name: Apply B18 rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          phase='Apply B18 rollback'
          trap 'status=$?; echo "ERROR phase=$phase command=$BASH_COMMAND status=$status line=$LINENO" >&2' ERR
          echo "=== $phase ==="
          for file in supabase/rollbacks/20260728090000_b18_rls_helpers_and_issue_security.rollback.sql supabase/rollbacks/20260728090100_b18_table_grants.rollback.sql; do
            echo "Executing $file"
            psql -X -a -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -f "$file"
          done

      - name: Validate B18 rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          phase='Validate B18 rollback'
          trap 'status=$?; echo "ERROR phase=$phase command=$BASH_COMMAND status=$status line=$LINENO" >&2' ERR
          echo "=== $phase ==="
          echo 'Executing supabase/validation/b18-security-rls-rollback.sql'
          psql -X -a -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -f supabase/validation/b18-security-rls-rollback.sql

      - name: Reapply B18 migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          phase='Reapply B18 migrations'
          trap 'status=$?; echo "ERROR phase=$phase command=$BASH_COMMAND status=$status line=$LINENO" >&2' ERR
          echo "=== $phase ==="
          for file in supabase/migrations/20260728090000_b18_rls_helpers_and_issue_security.sql supabase/migrations/20260728090100_b18_table_grants.sql; do
            echo "Executing $file"
            psql -X -a -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -f "$file"
          done

      - name: Validate B18 final state
        shell: bash
        run: |
          set -Eeuo pipefail
          phase='Validate B18 final state'
          trap 'status=$?; echo "ERROR phase=$phase command=$BASH_COMMAND status=$status line=$LINENO" >&2' ERR
          echo "=== $phase ==="
          echo 'Executing supabase/validation/b18-security-rls.sql'
          psql -X -a -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -f supabase/validation/b18-security-rls.sql
