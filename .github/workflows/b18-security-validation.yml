name: B18 security validation

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/rollbacks/**'
      - 'supabase/validation/**'
      - '.github/workflows/b18-security-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PostgreSQL B18 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: b18-test-only
          POSTGRES_DB: reformando_b18
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reformando_b18"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: b18-test-only
      PGDATABASE: reformando_b18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SQL and repository diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
          psql -v ON_ERROR_STOP=1 -f supabase/test/bootstrap_supabase_test_environment.sql
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          for migration in "${migrations[@]}"; do
            case "$migration" in
              20260728090000_b18_rls_helpers_and_issue_security.sql|20260728090100_b18_table_grants.sql)
                continue
                ;;
            esac
            psql -v ON_ERROR_STOP=1 -f "supabase/migrations/$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/validation/b18-security-baseline.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260728090000_b18_rls_helpers_and_issue_security.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260728090100_b18_table_grants.sql
          psql -v ON_ERROR_STOP=1 -f supabase/validation/b18-security-rls.sql
          if psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260728090100_b18_table_grants.sql; then
            echo 'B18 snapshot reapply unexpectedly succeeded' >&2
            exit 1
          else
            echo 'B18 snapshot reapply rejected as expected; original snapshot preserved'
          fi
          psql -v ON_ERROR_STOP=1 -f supabase/rollbacks/20260728090000_b18_rls_helpers_and_issue_security.rollback.sql
          psql -v ON_ERROR_STOP=1 -f supabase/rollbacks/20260728090100_b18_table_grants.rollback.sql
          psql -v ON_ERROR_STOP=1 -f supabase/validation/b18-security-rls-rollback.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260728090000_b18_rls_helpers_and_issue_security.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260728090100_b18_table_grants.sql
          psql -v ON_ERROR_STOP=1 -f supabase/validation/b18-security-rls.sql
