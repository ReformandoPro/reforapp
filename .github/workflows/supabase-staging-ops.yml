name: Supabase Staging Ops (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation mode (run one at a time)'
        type: choice
        required: true
        default: backup_only
        options:
          - backup_only
          - db_push
          - seed
          - verify
          - diagnose_migration_history
      confirm_project_ref:
        description: 'Must equal hafljwojvblyfljddjcr (staging project ref)'
        type: string
        required: true
      backup_confirmed:
        description: 'For db_push only: must equal I_HAVE_DOWNLOADED_BACKUP'
        type: string
        required: false
      OWNER1_USER_ID:
        description: 'For seed/verify: Auth user UUID (Org1 owner)'
        type: string
        required: false
      MEMBER1_USER_ID:
        description: 'For seed/verify: Auth user UUID (Org1 member)'
        type: string
        required: false
      OWNER2_USER_ID:
        description: 'For seed/verify: Auth user UUID (Org2 owner)'
        type: string
        required: false
      NO_MEMBERSHIP_USER_ID:
        description: 'For seed/verify: Auth user UUID (no membership user)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: supabase-staging-ops
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: hafljwojvblyfljddjcr
  BACKUP_PREFIX: reformando-staging-before-b5

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard rails (project ref)
        shell: bash
        run: |
          set +x
          if [ "${{ inputs.confirm_project_ref }}" != "${STAGING_PROJECT_REF}" ]; then
            echo "ERROR: confirm_project_ref must equal ${STAGING_PROJECT_REF}." >&2
            exit 1
          fi

      - name: Mask secrets
        shell: bash
        run: |
          set +x
          if [ -n "${{ secrets.SUPABASE_STAGING_DB_URL }}" ]; then
            echo "::add-mask::${{ secrets.SUPABASE_STAGING_DB_URL }}"
          fi
          if [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::add-mask::${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase CLI
        shell: bash
        run: |
          set +x
          npm i -g supabase@2
          supabase --version

      - name: Diagnose migration history (read-only)
        if: ${{ inputs.mode == 'diagnose_migration_history' }}
        shell: bash
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          set -Eeuo pipefail
          set +x

          if [ -z "${SUPABASE_STAGING_DB_URL:-}" ]; then
            echo "ERROR: Missing secret SUPABASE_STAGING_DB_URL" >&2
            exit 1
          fi

          REPORT="$RUNNER_TEMP/supabase-migration-history-diagnostic.txt"
          export PGOPTIONS='-c statement_timeout=30000 -c lock_timeout=5000'

          psql --dbname "$SUPABASE_STAGING_DB_URL" \
            --no-psqlrc --no-align --tuples-only --quiet \
            --set=ON_ERROR_STOP=1 > "$REPORT" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SHOW transaction_read_only;
          SELECT current_setting('transaction_read_only') AS transaction_read_only;
          SELECT CASE WHEN current_setting('transaction_read_only') = 'on' THEN 1 ELSE 1 / 0 END AS read_only_guard;

          SELECT '# Supabase migration history diagnostic';
          SELECT '## Migration history';
          SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;
          SELECT '## Target migration presence';
          SELECT v.version,
            EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations h WHERE h.version = v.version) AS present
          FROM (VALUES ('20260706100000'), ('20260728090000'), ('20260728090100'), ('20260801100000')) v(version)
          ORDER BY v.version;

          SELECT '## project_task_issues columns';
          SELECT column_name, data_type, udt_name, is_nullable, column_default
          FROM information_schema.columns
          WHERE table_schema = 'public' AND table_name = 'project_task_issues'
          ORDER BY ordinal_position;
          SELECT '## project_task_issues constraints and indexes';
          SELECT tc.constraint_name, tc.constraint_type, kcu.column_name,
                 ccu.table_name AS foreign_table, ccu.column_name AS foreign_column
          FROM information_schema.table_constraints tc
          LEFT JOIN information_schema.key_column_usage kcu
            ON kcu.constraint_schema = tc.constraint_schema
           AND kcu.constraint_name = tc.constraint_name
           AND kcu.table_name = tc.table_name
          LEFT JOIN information_schema.constraint_column_usage ccu
            ON ccu.constraint_schema = tc.constraint_schema
           AND ccu.constraint_name = tc.constraint_name
          WHERE tc.table_schema = 'public' AND tc.table_name = 'project_task_issues'
          ORDER BY tc.constraint_name, kcu.ordinal_position;
          SELECT indexname, indexdef FROM pg_indexes
          WHERE schemaname = 'public' AND tablename = 'project_task_issues'
          ORDER BY indexname;

          SELECT '## RLS and policies';
          SELECT schemaname, tablename, rowsecurity, forcerowsecurity
          FROM pg_tables
          WHERE schemaname = 'public'
            AND tablename IN ('project_task_issues', 'memberships', 'project_tasks');
          SELECT schemaname, tablename, policyname, permissive, roles, cmd, qual, with_check
          FROM pg_policies
          WHERE schemaname = 'public'
            AND tablename IN ('project_task_issues', 'memberships', 'project_tasks')
          ORDER BY tablename, policyname;

          SELECT '## DML grants';
          SELECT table_name, grantee, privilege_type, is_grantable
          FROM information_schema.role_table_grants
          WHERE table_schema = 'public'
            AND table_name IN ('memberships', 'projects', 'project_tasks', 'project_phases', 'project_task_issues')
            AND grantee IN ('public', 'anon', 'authenticated', 'service_role')
          ORDER BY table_name, grantee, privilege_type;

          SELECT '## B18 helper functions';
          SELECT n.nspname, p.proname, pg_get_function_identity_arguments(p.oid),
                 pg_get_userbyid(p.proowner), p.prosecdef, p.proconfig,
                 has_function_privilege('public', p.oid, 'EXECUTE'),
                 has_function_privilege('anon', p.oid, 'EXECUTE'),
                 has_function_privilege('authenticated', p.oid, 'EXECUTE')
          FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = 'public'
            AND p.proname IN ('is_org_member', 'is_org_admin', 'org_has_any_membership',
                              'org_is_empty_for_bootstrap', 'is_client_in_org')
          ORDER BY p.proname, pg_get_function_identity_arguments(p.oid);

          SELECT '## Baselines';
          SELECT to_regclass('public.b18_grant_baseline') IS NOT NULL AS b18_baseline_present \gset
          \if :b18_baseline_present
            SELECT privilege_key, had_privilege FROM public.b18_grant_baseline ORDER BY privilege_key;
          \else
            SELECT 'b18_grant_baseline=absent' AS baseline_status;
          \endif
          SELECT to_regclass('public.authenticated_operational_grant_baseline') IS NOT NULL AS operational_baseline_present \gset
          \if :operational_baseline_present
            SELECT privilege_key, had_privilege FROM public.authenticated_operational_grant_baseline ORDER BY privilege_key;
          \else
            SELECT 'authenticated_operational_grant_baseline=absent' AS baseline_status;
          \endif
          SELECT '## Operational baseline object';
          SELECT n.nspname, c.relname, c.relkind
          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public' AND c.relname = 'authenticated_operational_grant_baseline';

          COMMIT;
          SQL

          sed -E 's#(postgres(ql)?://)[^@[:space:]]+@#\1[REDACTED]@#g' "$REPORT" > "$REPORT.sanitized"
          mv "$REPORT.sanitized" "$REPORT"
          test -s "$REPORT"

      - name: Upload migration diagnostic artifact
        if: ${{ inputs.mode == 'diagnose_migration_history' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-migration-history-diagnostic
          path: ${{ runner.temp }}/supabase-migration-history-diagnostic.txt
          if-no-files-found: error
          retention-days: 7

      # -----------------------
      # backup_only
      # -----------------------
      - name: Backup (public schema) to artifact
        if: ${{ inputs.mode == 'backup_only' }}
        shell: bash
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          set +x
          if [ -z "${SUPABASE_STAGING_DB_URL}" ]; then
            echo "ERROR: Missing secret SUPABASE_STAGING_DB_URL" >&2
            exit 1
          fi

          TS="$(date -u +%Y%m%d-%H%M%S)"
          OUT_DIR="$RUNNER_TEMP/supabase-backups"
          OUT_FILE="${BACKUP_PREFIX}-${TS}.sql"
          OUT_PATH="$OUT_DIR/$OUT_FILE"
          mkdir -p "$OUT_DIR"

          # Dump ONLY schema public (read-only)
          supabase db dump \
            --db-url "$SUPABASE_STAGING_DB_URL" \
            --schema public \
            -f "$OUT_PATH"

          test -f "$OUT_PATH" || (echo "ERROR: Backup file not created" >&2 && exit 1)
          test -s "$OUT_PATH" || (echo "ERROR: Backup file is empty" >&2 && exit 1)

          echo "Backup created: $OUT_FILE"

      - name: Upload backup artifact
        if: ${{ inputs.mode == 'backup_only' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-staging-backup-public-schema
          path: ${{ runner.temp }}/supabase-backups/*.sql
          if-no-files-found: error
          retention-days: 14

      # -----------------------
      # db_push
      # -----------------------
      - name: Guard rails (backup_confirmed)
        if: ${{ inputs.mode == 'db_push' }}
        shell: bash
        run: |
          set +x
          if [ "${{ inputs.backup_confirmed }}" != "I_HAVE_DOWNLOADED_BACKUP" ]; then
            echo "ERROR: For db_push you must set backup_confirmed=I_HAVE_DOWNLOADED_BACKUP" >&2
            exit 1
          fi

      - name: Supabase link (requires SUPABASE_ACCESS_TOKEN)
        if: ${{ inputs.mode == 'db_push' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +x
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "ERROR: Missing secret SUPABASE_ACCESS_TOKEN (required for db_push)." >&2
            exit 1
          fi

          # Auth for supabase CLI
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "${STAGING_PROJECT_REF}"

      - name: Apply migrations (supabase db push)
        if: ${{ inputs.mode == 'db_push' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +x
          # Do not reset, do not drop. db push should fail if conflicts exist.
          supabase db push

      # -----------------------
      # seed
      # -----------------------
      - name: Seed (render temp + execute)
        if: ${{ inputs.mode == 'seed' }}
        shell: bash
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          set +x
          if [ -z "${SUPABASE_STAGING_DB_URL}" ]; then
            echo "ERROR: Missing secret SUPABASE_STAGING_DB_URL" >&2
            exit 1
          fi

          # Require UUID inputs
          if [ -z "${{ inputs.OWNER1_USER_ID }}" ] || [ -z "${{ inputs.MEMBER1_USER_ID }}" ] || [ -z "${{ inputs.OWNER2_USER_ID }}" ] || [ -z "${{ inputs.NO_MEMBERSHIP_USER_ID }}" ]; then
            echo "ERROR: Missing one or more required UUID inputs for seed." >&2
            exit 1
          fi

          SRC="supabase/seed/staging-demo.sql"
          test -f "$SRC" || (echo "ERROR: Seed source not found at $SRC" >&2 && exit 1)

          OUT_DIR="$RUNNER_TEMP/seed"
          mkdir -p "$OUT_DIR"
          OUT="$OUT_DIR/staging-demo.rendered.sql"

          # Render placeholders (do not print UUIDs)
          sed \
            -e "s/__OWNER1_USER_ID__/${{ inputs.OWNER1_USER_ID }}/g" \
            -e "s/__MEMBER1_USER_ID__/${{ inputs.MEMBER1_USER_ID }}/g" \
            -e "s/__OWNER2_USER_ID__/${{ inputs.OWNER2_USER_ID }}/g" \
            -e "s/__NO_MEMBERSHIP_USER_ID__/${{ inputs.NO_MEMBERSHIP_USER_ID }}/g" \
            "$SRC" > "$OUT"

          # Execute seed
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y postgresql-client; }
          psql "$SUPABASE_STAGING_DB_URL" -v ON_ERROR_STOP=1 -f "$OUT"

          # Cleanup temp seed
          rm -f "$OUT"

      # -----------------------
      # verify
      # -----------------------
      - name: Verify (counts + invariants)
        if: ${{ inputs.mode == 'verify' }}
        shell: bash
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          set +x
          if [ -z "${SUPABASE_STAGING_DB_URL}" ]; then
            echo "ERROR: Missing secret SUPABASE_STAGING_DB_URL" >&2
            exit 1
          fi

          if [ -z "${{ inputs.NO_MEMBERSHIP_USER_ID }}" ]; then
            echo "ERROR: verify requires NO_MEMBERSHIP_USER_ID input." >&2
            exit 1
          fi

          Q="$RUNNER_TEMP/verify.sql"
          cat > "$Q" <<'SQL'
          -- Counts
          select 'organizations' as table, count(*)::int as count from public.organizations;
          select 'memberships' as table, count(*)::int as count from public.memberships;
          select 'clients' as table, count(*)::int as count from public.clients;
          select 'projects' as table, count(*)::int as count from public.projects;

          select 'profiles' as table, count(*)::int as count from public.profiles;
          -- Optional module tables: legacy-safe, skip with a NOTICE instead of
          -- failing when the table does not exist on this environment (same
          -- to_regclass(...) pattern already used in supabase/seed/staging-demo.sql).
          do $$
          declare
          tbl text;
          v_count int;
          optional_tables text[] := array['project_phases','project_progress_updates','project_costs','project_budgets','project_budget_lines','project_purchases','project_purchase_items','project_task_comments'];
          begin
          foreach tbl in array optional_tables loop
          if to_regclass(format('public.%I', tbl)) is null then
          raise notice 'verify: % skipped because table does not exist (legacy staging schema not yet migrated for this module).', tbl;
          else
          execute format('select count(*) from public.%I', tbl) into v_count;
          raise notice 'verify: % count = %', tbl, v_count;
          end if;
          end loop;
          end $$;

          -- project_tasks: core seeded module, but legacy-aware. Only count(*) is
          -- used here (never assume a phase_id column exists; see
          -- supabase/seed/staging-demo.sql section 6.2 for why).
          do $$
          begin
          if to_regclass('public.project_tasks') is null then
          raise exception 'verify: required table public.project_tasks does not exist.';
          else
          raise notice 'verify: project_tasks count = %', (select count(*) from public.project_tasks);
          end if;
          end $$;
          
          -- Invariants
          -- no-membership user must not have memberships
          select count(*)::int as no_membership_user_memberships
          from public.memberships
          where user_id = '__NO_MEMBERSHIP_USER_ID__'::uuid;

            -- documents should NOT be seeded
            -- if table exists, count should be 0 (seed does not insert). Legacy-safe:
            -- uses EXECUTE so public.project_documents is only resolved at runtime,
            -- inside the branch where the table is known to exist (same pattern as
            -- the optional module tables above), instead of a static reference that
            -- postgres resolves eagerly even inside a CASE/ELSE branch.
            do $$
            declare
            v_count int;
            begin
            if to_regclass('public.project_documents') is null then
            raise notice 'verify: project_documents skipped because table does not exist (legacy staging schema not yet migrated for this module).';
            else
            execute 'select count(*)::int from public.project_documents' into v_count;
            raise notice 'verify: project_documents count = %', v_count;
            end if;
            end $$;
          SQL

          # Replace placeholder in verify SQL
          sed -i \
            -e "s/__NO_MEMBERSHIP_USER_ID__/${{ inputs.NO_MEMBERSHIP_USER_ID }}/g" \
            "$Q"

          command -v psql >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y postgresql-client; }
          psql "$SUPABASE_STAGING_DB_URL" -v ON_ERROR_STOP=1 -f "$Q"

          rm -f "$Q"
