name: Project create post-deploy verification and draft PR

on:
  push:
    branches:
      - fix/project-create-post-merge

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-and-open-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.APP_BETA_SSH_PRIVATE_KEY }}" > ~/.ssh/app_beta_postdeploy_key
          chmod 600 ~/.ssh/app_beta_postdeploy_key
          printf '%s\n' "${{ secrets.APP_BETA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify app-beta runtime SHA and sanitized logs
        shell: bash
        env:
          EXPECTED_SHA: a2026698dba03fb6391b12e6640a862923b9ebbf
        run: |
          set -Eeuo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -i ~/.ssh/app_beta_postdeploy_key \
            -p "${{ secrets.APP_BETA_SSH_PORT }}" \
            "${{ secrets.APP_BETA_SSH_USER }}@${{ secrets.APP_BETA_SSH_HOST }}" \
            "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          COMPOSE="/docker/reformando-app-beta"
          SERVICE="reformando-app-beta"
          container_id="$(cd "$COMPOSE" && docker compose ps -q "$SERVICE")"
          [ -n "$container_id" ]
          deployed_sha="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container_id" | sed -n 's/^GIT_COMMIT_SHA=//p')"
          [ "$deployed_sha" = "$EXPECTED_SHA" ]
          echo "::notice title=app_beta_deployed_sha::$deployed_sha"
          recent_errors="$(cd "$COMPOSE" && docker compose logs --since=10m --tail=1000 "$SERVICE" 2>&1 \
            | grep -Ei '\[private-projects\]|Unable to read projects from Supabase|permission denied for table projects|column projects\.created_at does not exist' \
            | tail -20 || true)"
          if [ -n "$recent_errors" ]; then
            printf '%s\n' "$recent_errors" | sed -E 's#(https://)[^[:space:]]+#\1[REDACTED]#g; s#(eyJ)[A-Za-z0-9._-]+#[REDACTED]#g'
            exit 1
          fi
          echo '::notice title=app_beta_project_logs::no matching project read errors in last 10 minutes'
          REMOTE

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -y >/dev/null && sudo apt-get install -y postgresql-client >/dev/null; }

      - name: Verify beta migration and exact corrected projection
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$SUPABASE_STAGING_DB_URL"
          psql "$SUPABASE_STAGING_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from supabase_migrations.schema_migrations where version='20260728100000') then
              raise exception 'project-create migration is not recorded';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema='public' and table_name='projects' and column_name='description'
            ) then
              raise exception 'projects.description missing';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema='public' and table_name='projects' and column_name='expected_end_date'
            ) then
              raise exception 'projects.expected_end_date missing';
            end if;
          end $$;
          begin;
          set local role authenticated;
          select id, organization_id, client_id, name, status, address, type, progress, client_name, updated_at
          from public.projects
          order by updated_at desc
          limit 0;
          rollback;
          SQL
          echo '::notice title=beta_project_projection::corrected authenticated projection passed'

      - name: Create or preserve Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          existing="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/pulls?state=open&head=ReformandoPro:$HEAD_BRANCH")"
          count="$(EXISTING="$existing" node -e 'console.log(JSON.parse(process.env.EXISTING).length)')"
          if [ "$count" != "0" ]; then
            echo 'Draft PR already exists.'
            exit 0
          fi
          body=$'## Incident root cause\n- PR #129 deploy failed; app-beta remained on PR #128.\n- Beta legacy projects table does not contain created_at.\n- Project list selected created_at and failed before rendering data.\n- Project-create migration was not applied.\n\n## Fix\n- Use the beta-compatible projects projection without created_at.\n- Sanitize Supabase errors while retaining structured error codes.\n- Add regression coverage for owner/admin/member CTA behavior.\n- Apply and verify only migration 20260728100000 in app-beta with schema backup.\n\n## Validation\n- TypeScript, lint, focused tests, full suite and build pass.\n- Corrective SHA deployed to app-beta and health verified.\n- No production changes, no service role in application code, RLS remains enabled.'
          payload="$(jq -n \
            --arg title 'fix(projects): restore project creation in app-beta' \
            --arg head "$HEAD_BRANCH" \
            --arg base 'main' \
            --arg body "$body" \
            '{title: $title, head: $head, base: $base, body: $body, draft: true}')"
          response="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$REPOSITORY/pulls" \
            --data "$payload")"
          RESPONSE="$response" node -e 'const p=JSON.parse(process.env.RESPONSE); console.log(`draft_pr:number=${p.number} url=${p.html_url}`)'
