name: Projects authenticated read validation

on:
  pull_request:
    paths:
      - 'src/app/projects/**'
      - 'src/app/app/projects/**'
      - 'src/lib/data/projects.ts'
      - 'src/lib/services/private-projects.ts'
      - 'src/lib/services/org-context.ts'
      - 'src/lib/supabase/ssr.ts'
      - 'tests/data/projects-first-read.test.ts'
      - 'tests/data/project-tasks.test.ts'
      - 'tests/app/project-tasks-page.test.ts'
      - 'tests/app/projects-page-actions.test.ts'
      - 'tests/components/task-board.test.ts'
      - 'tests/components/create-project-form.test.ts'
      - 'tests/services/private-projects.test.ts'
      - 'src/components/tasks/TaskBoard.tsx'
      - 'src/components/tasks/TaskColumn.tsx'
      - 'src/components/tasks/TaskCard.tsx'
      - 'src/components/tasks/index.ts'
      - 'scripts/ci/projects-authenticated-read.mjs'
      - '.github/workflows/projects-authenticated-read-validation.yml'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-projects-read:
    name: Ephemeral Supabase authenticated projects read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_FIXTURE_PASSWORD: 'CI-only-password-123456789!'
    steps:
      - name: Validate repository diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR functional scope
        shell: bash
        run: |
          set -Eeuo pipefail
          base='${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}'
          head='${{ github.event.pull_request.head.sha || github.sha }}'
          allowed='src/app/projects/error.tsx
          src/app/projects/page.tsx
          src/app/projects/[id]/page.tsx
          src/app/projects/[id]/actions.ts
          src/lib/data/index.ts
          src/lib/data/projects.ts
          tests/data/projects-first-read.test.ts
          tests/data/project-detail.test.ts
          tests/data/project-phases.test.ts
          tests/data/project-tasks.test.ts
          tests/app/project-tasks-page.test.ts
          tests/services/project-operational-permissions.test.ts
          tests/components/task-board.test.ts
          src/components/tasks/CreateProjectTaskForm.tsx
          src/components/tasks/TaskBoard.tsx
          src/components/tasks/TaskColumn.tsx
          src/components/tasks/TaskCard.tsx
          src/components/tasks/index.ts
          src/lib/services/project-operational-permissions.ts
          src/lib/services/project-task-create.ts
          src/lib/services/project-create.ts
          tests/app/project-task-create-action.test.ts
          tests/app/project-create-action.test.ts
          tests/components/create-project-task-form.test.ts
          tests/components/create-project-form.test.ts
          tests/services/project-task-create.test.ts
          tests/services/project-create.test.ts
          src/app/app/projects/page.tsx
          src/app/app/projects/[id]/page.tsx
          src/app/app/projects/new/actions.ts
          src/app/app/projects/new/CreateProjectForm.tsx
          src/app/app/projects/new/page.tsx
          src/app/app/projects/new/state.ts
          src/app/app/projects/page.tsx
          src/lib/services/private-projects.ts
          tests/app/projects-page-actions.test.ts
          tests/components/create-project-form.test.ts
          tests/services/private-projects.test.ts
          tests/data/project-tasks.test.ts'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! grep -qxF "$file" <<< "$allowed" && [[ "$file" != .github/workflows/* ]] && [[ "$file" != scripts/ci/* ]] && [[ "$file" != supabase/* ]]; then
              echo "Unexpected functional file outside authenticated projects read scope: $file" >&2
              exit 1
            fi
          done < <(git diff --name-only "$base...$head")
          git diff --check "$base...$head"

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.39.2

      - name: Start ephemeral Supabase
        shell: bash
        run: |
          set -Eeuo pipefail
          log_file="$RUNNER_TEMP/projects-authenticated-read.log"
          raw_log="$RUNNER_TEMP/supabase-start.raw.log"
          : > "$log_file"
          sanitize_supabase_output() {
            sed -E \
              -e 's#(^[[:space:]]*JWT secret:).*#\1 [REDACTED]#I' \
              -e 's#(^[[:space:]]*anon key:).*#\1 [REDACTED]#I' \
              -e 's#(^[[:space:]]*service_role key:).*#\1 [REDACTED]#I' \
              -e 's#(^[[:space:]]*S3 Access Key:).*#\1 [REDACTED]#I' \
              -e 's#(^[[:space:]]*S3 Secret Key:).*#\1 [REDACTED]#I' \
              -e 's#(ANON_KEY=).*#\1[REDACTED]#I' \
              -e 's#(SERVICE_ROLE_KEY=).*#\1[REDACTED]#I' \
              -e 's#(JWT_SECRET=).*#\1[REDACTED]#I'
          }
          echo '=== Supabase CLI version ===' | tee -a "$log_file"
          supabase --version 2>&1 | tee -a "$log_file"
          echo '=== Docker version ===' | tee -a "$log_file"
          docker version 2>&1 | tee -a "$log_file"
          echo '=== Docker info ===' | tee -a "$log_file"
          docker info 2>&1 | tee -a "$log_file"
          base='${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}'
          head='${{ github.event.pull_request.head.sha || github.sha }}'
          mapfile -t changed_files < <(git diff --name-only "$base...$head")
          for file in "${changed_files[@]}"; do
            [ -f "$file" ] || continue
            if grep -nE '(^|[;&|[:space:]])supabase[[:space:]]+(link|db[[:space:]]+push)([;&|[:space:]]|$)' "$file"; then
              echo "Remote Supabase command detected in changed file: $file" >&2
              exit 1
            fi
          done
          echo '=== supabase start --debug ===' | tee -a "$log_file"
          set +e
          supabase start --debug 2>&1 | tee "$raw_log" >/dev/null
          supabase_status=${PIPESTATUS[0]}
          set -e
          sanitize_supabase_output < "$raw_log" | tee -a "$log_file"
          rm -f "$raw_log"
          if [ "$supabase_status" -ne 0 ]; then
            echo '=== docker ps -a ===' | tee -a "$log_file"
            docker ps -a 2>&1 | tee -a "$log_file" || true
            echo '=== docker images ===' | tee -a "$log_file"
            docker images 2>&1 | tee -a "$log_file" || true
            echo '=== supabase status --debug ===' | tee -a "$log_file"
            supabase status --debug 2>&1 | sanitize_supabase_output | tee -a "$log_file" || true
            echo "::error title=Ephemeral Supabase failed::supabase start --debug failed with exit code $supabase_status"
            {
              echo '## Ephemeral Supabase startup failure'
              echo
              echo "- Exit code: \`$supabase_status\`"
              echo
              echo '```text'
              tail -n 200 "$log_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$supabase_status"
          fi
          echo '=== supabase status ===' | tee -a "$log_file"
          supabase status 2>&1 | sanitize_supabase_output | tee -a "$log_file"

      - name: Apply local migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          supabase db reset --local --no-seed

      - name: Export local Supabase environment
        shell: bash
        run: |
          set -Eeuo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          read_env_value() {
            local key="$1" value
            value=$(awk -F= -v key="$key" '$1 == key {sub(/^[^=]*=/, ""); gsub(/^"|"$/, ""); print}' "$RUNNER_TEMP/supabase.env")
            [ -n "$value" ] || { echo "Missing Supabase environment value: $key" >&2; return 1; }
            printf '%s' "$value"
          }
          supabase_url=$(read_env_value API_URL)
          supabase_anon_key=$(read_env_value ANON_KEY)
          supabase_service_role_key=$(read_env_value SERVICE_ROLE_KEY)
          case "$supabase_url" in http://*|https://*) ;; *) echo 'Invalid local Supabase URL format' >&2; exit 1 ;; esac
          echo "::add-mask::$supabase_anon_key"
          echo "::add-mask::$supabase_service_role_key"
          {
            echo "SUPABASE_URL=$supabase_url"
            echo "SUPABASE_ANON_KEY=$supabase_anon_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$supabase_service_role_key"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/supabase.env"
          echo 'Local Supabase environment exported without printing credentials.'

      - name: Create Auth and database fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          node scripts/ci/projects-authenticated-read.mjs --fixtures 2>&1 | tee -a "$RUNNER_TEMP/projects-authenticated-read.log"
          fixture_status=${PIPESTATUS[0]}
          set -e
          if [ "$fixture_status" -ne 0 ]; then
            echo "::error title=Fixture creation failed::fixture creation exited with code $fixture_status"
            {
              echo '## Fixture creation failure'
              echo
              echo "- Exit code: \`$fixture_status\`"
              echo '- Artifact: `projects-authenticated-read-diagnostics`'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$fixture_status"
          fi

      - name: Run authenticated integration cases
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          node scripts/ci/projects-authenticated-read.mjs --authenticated 2>&1 | tee -a "$RUNNER_TEMP/projects-authenticated-read.log"
          authenticated_status=${PIPESTATUS[0]}
          set -e
          if [ "$authenticated_status" -ne 0 ]; then
            echo "::error title=Authenticated integration failed::authenticated integration exited with code $authenticated_status"
            {
              echo '## Authenticated integration failure'
              echo
              echo "- Exit code: \`$authenticated_status\`"
              echo '- Artifact: `projects-authenticated-read-diagnostics`'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$authenticated_status"
          fi

      - name: Run anonymous and isolation cases
        run: node scripts/ci/projects-authenticated-read.mjs --anonymous --isolation

      - name: Run application validation
        run: |
          npx tsc --noEmit --incremental false
          npm run lint
          npm run test -- tests/data/projects-first-read.test.ts tests/data/project-tasks.test.ts tests/app/projects-page-actions.test.ts tests/services/private-projects.test.ts

      - name: Upload diagnostic artifact on failure
        id: sanitize_diagnostic
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Eq 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|JWT secret:[[:space:]]+[^[]|service_role key:[[:space:]]+eyJ|S3 Secret Key:[[:space:]]+[a-f0-9]{32,}|(ANON_KEY|SERVICE_ROLE_KEY|JWT_SECRET)=[^[]' "$RUNNER_TEMP/projects-authenticated-read.log"; then
            echo 'Diagnostic log contains an unredacted credential' >&2
            exit 1
          fi
          echo 'Diagnostic log secret scan passed.'

      - name: Upload diagnostic artifact
        if: failure() && steps.sanitize_diagnostic.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: projects-authenticated-read-diagnostics
          path: ${{ runner.temp }}/projects-authenticated-read.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
